# Quantinuum H1-1 — trapped-ion QCCD, 20 qubits, all-to-all.
#
# Numbers are the per-machine values from Quantinuum's live "Performance Validation"
# page (latest randomized-benchmarking sweep), cross-checked against the H1 Product
# Data Sheet v8.0.1 (2025-06-09) "Typical" column. Quantinuum publishes ZONE-AVERAGED
# mean infidelities, not medians, and publishes no T1/T2 and no per-gate durations.

[device]
name = "quantinuum_h1_1"
vendor = "Quantinuum"
technology = "trapped ion, 171Yb+ hyperfine qubits, QCCD linear trap, 5 gate zones (System Model H1)"
n_qubits = 20
topology = "all-to-all"
native_1q = ["U1q", "Rz"]
native_2q = ["ZZ", "RZZ", "SU4"]
retrieved_at = 2026-08-20

[noise]
gate_1q = {error_median = 1.8e-05}
gate_2q = {error_median = 9.7e-04}
readout = {error_median = 2.3e-03, p01 = 1.2e-03, p10 = 3.4e-03}
notes = """
error_median fields hold Quantinuum's ZONE-AVERAGED MEAN infidelity, not a median: \
"The typical infidelities reported on this product data sheet are an average over all \
operational zones." Treat them as means.
readout.error_median = 2.3e-3 is our arithmetic mean of the two published SPAM numbers, \
(1.2e-3 + 3.4e-3)/2; the vendor itself defines its headline SPAM error the same way \
("The reported SPAM error is the average between the |0> and |1> state-preparation \
experiments"). p01 = SPAM Error (0) = P(read 1 | prepared 0); p10 = SPAM Error (1) = \
P(read 0 | prepared 1). The H1 data sheet "Typical" SPAM is 2 x 10^-3, consistent.
OMITTED, not published: t1_us, t2_us. Reported instead as "Memory Error per Depth-1 Circuit \
Time" = 2.2e-04 +/- 9.2e-05 (data-sheet typical 2 x 10^-4, max 1 x 10^-3): an idling+transport \
dephasing probability per depth-1 circuit time, not a T1/T2, and not convertible without a \
published depth-1 time in seconds.
OMITTED, not published: gate durations. The H1 QCCD paper only gives a transport/cooling figure: \
"A typical duration to reconfigure the ion ... motional ground state is 3-5 ms." That is a \
reconfiguration time, not a gate time; do not use it as one.
Also published but not modelled here: 1-Qubit Gate Leakage Error 6.4e-06 +/- 1.2e-06, \
2-Qubit Gate Leakage Error 2.2e-04 +/- 2.7e-05, Measurement Crosstalk Error 4.1e-05 +/- 1.7e-06.
"""

