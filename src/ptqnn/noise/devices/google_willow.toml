# Google Willow — 105-qubit superconducting transmon processor (the QEC chip of
# Nature 638, 920-926 (2025), "Quantum error correction below the surface code threshold").
#
# NOT publicly accessible hardware. Included as a best-in-class reference point.
#
# IMPORTANT: every number below is a MEAN over qubits/pairs, not a median. The paper's
# Supplementary Table S5 reports "mean values and the uncertainties indicate one standard
# deviation from the mean value". The schema field names say `median`; they hold means here.
# The only medians Google published for this work are the median physical-qubit lifetime
# (85 +/- 7 us, over one distance-7 patch) and a median CZ Pauli error 2.6e-3 for the
# *72-qubit* chip. Neither is used below.

[device]
name = "google_willow"
vendor = "Google Quantum AI"
technology = "superconducting transmon, tunable couplers (Willow, 105-qubit QEC chip)"
n_qubits = 105
topology = "square"
native_1q = ["xy_microwave", "virtual_z"]
native_2q = ["cz"]
retrieved_at = 2026-08-20

[noise]
t1_us = {median = 68.0}
t2_us = {median = 89.0, kind = "cpmg"}
gate_1q = {error_median = 5.3e-04, duration_ns = 25.0}
gate_2q = {error_median = 4.1e-03, duration_ns = 42.0}
readout = {error_median = 8.0e-03}
notes = """
ALL `*_median` VALUES ARE MEANS, NOT MEDIANS (Supplementary Table S5 reports mean +/- 1 s.d.). \
Standard deviations, which are large: T1 68 +/- 13 us; T2,cpmg 89 +/- 28 us; 1q 5.3e-4 +/- 4.3e-4; \
CZ 4.1e-3 +/- 2.2e-3; readout 0.8e-2 +/- 0.2e-2. The 1q error s.d. is ~80% of the mean, so a \
homogeneous-noise model built from these means is a coarse approximation.
gate_2q.error_median 4.1e-3 is the TOTAL CZ error INCLUDING CZ crosstalk (~3.3e-4) and CZ leakage \
(2.0e-4); do not add those on top. Errors are Pauli errors from XEB/RB, not 1 - fidelity of a \
process-fidelity measurement, so no conversion was applied.
readout.error_median = 0.8e-2 exactly as tabulated. Google's separate Willow Spec Sheet gives \
0.77% +/- 0.21% for the same chip; the two agree to the tabulated precision.
OMITTED: readout.duration_ns. Not published as a number anywhere in the paper, SI, spec sheet or \
blog; it appears only as a per-qubit heat map (Fig. S7f, "Length of the applied readout tone on \
each readout resonator"), which is a figure read-off, not a spec. Reset duration likewise not \
published. What IS published is the full surface-code cycle time, 1108 ns.
OMITTED: readout p01/p10. Only a symmetric readout error is tabulated.
OMITTED: idle.zz_coupling_khz. Google reports a CZ crosstalk *error* (~3.3e-4 per CZ) and a data-qubit \
idle error during measure+reset ((0.8 +/- 0.3)e-2), not a ZZ coupling rate in Hz.
Note there is a SECOND Willow chip (the random-circuit-sampling "Chip 2") with different numbers \
(T1 mean 98 us +/- 32 us, iswap-like 2q error 0.14%). Do not mix them; this file is the QEC chip.
"""

