# 1.2.8, last_update_date 2025-02-26T15:16:25-05:00, as shipped by IBM inside
# qiskit-ibm-runtime's fake_provider (props_fez.json / conf_fez.json). IBM publishes
# the PER-QUBIT and PER-EDGE table there; the medians below were computed by us from
# that table with statistics.median (n = 156 qubits, n = 352 directed CZ edges) and
# re-verified locally. Do not mix them with numbers from another date or device --
# see notes for how much fez itself drifted between July 2024 and February 2025.

