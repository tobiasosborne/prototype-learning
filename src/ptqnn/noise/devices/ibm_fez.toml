notes = """
per_qubit arrays are indexed by physical qubit 0..155 and are IBM's own per-qubit values from \
the same snapshot; the median fields are their medians. Spread is large: T1 27.15-274.39 us, \
T2 5.99-302.79 us, readout error 1.46e-3 to 1.06e-1. A single-median homogeneous noise model \
throws that away -- prefer per_qubit where the backend supports it.
t2_us.kind = "echo" is stated by IBM: "T_2 is reported from a Hahn echo sequence."
gate_1q.error_median is the SX error. IBM measures SX, X and ID in one randomized-benchmarking \
sequence "and it is assumed their errors are the same", and indeed id/x/rx/sx all carry the \
identical 2.28688e-4 median in this snapshot. RZ is virtual: gate_error 0, gate_length 0.
gate_2q.error_median is the median over all 352 DIRECTED CZ edges (176 undirected). IBM's \
definition includes a layer of single-qubit Cliffords: "this randomized benchmarking uses \
alternating layers of single-qubit Cliffords and two-qubit gates, and thus the final 2Q error \
value includes the error of the layer of single-qubit Cliffords." So it slightly OVERSTATES the \
bare CZ error. Measured in isolation, so it EXCLUDES crosstalk from simultaneous gates.
gate_2q.duration_ns = 84 is the median; 348 of 352 edges are 84 ns and 4 are 104 ns.
readout p01 = prob_meas1_prep0 = P(read 1 | prepared 0) = 3.90625e-3 median; \
p10 = prob_meas0_prep1 = P(read 0 | prepared 1) = 1.14746e-2 median. Note the strong asymmetry \
(3x): |1> decays toward |0> during the 1560 ns readout. IBM defines its readout_error as the \
mean of the two, and (3.90625e-3 + 1.14746e-2)/2 = 7.69e-3, close to but not identical with the \
median-of-means 7.56836e-3 recorded here -- medians do not commute with averaging.
OMITTED, not published: idle.zz_coupling_khz. IBM publishes no residual-ZZ number for Heron, \
only the qualitative claim that tunable couplers "virtually eliminate cross-talk". ZZ figures \
circulating for other tunable-coupler devices must not be attributed to Heron. Qubit frequencies \
and anharmonicities are also absent (the snapshot's hamiltonian field is empty).
DRIFT / CROSS-CHECK. IBM's live public dashboard (quantum.cloud.ibm.com/computers, undated) \
currently reports for ibm_fez: median 2Q error 2.6108678e-3, best 2Q edge 1.499287e-3 on (9,10), \
EPLG_100 4.5436798e-3, median readout error 7.9956055e-3 -- i.e. CZ has improved ~1.5x since \
this snapshot while readout is unchanged. An independent published table for ibm_fez as of \
2024-07-04 gives median T1 136.52 us, T2 78.58 us, SX error 2.88e-4, CZ error 2.848e-3 at 68 ns, \
readout assignment error 1.63e-2. Coherence and gate time are strongly epoch-dependent; always \
carry the date. Other Heron r2/r3 snapshots differ more: ibm_kingston (r2, Apr 2026) has median \
T1 282.8 us, T2 144.2 us, SX 32 ns, CZ 68 ns, readout 2280 ns.
Layer fidelity itself is not published, only EPLG_100 = (4/5)(1 - LF^(1/99)).
"""

